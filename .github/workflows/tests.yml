name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, macos-13, macos-14, windows-2022, ubuntu-22.04-arm ]
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t" ]

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v5.6.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install requirements
      run: |
        pip install typing-extensions pytest .

    - name: Run Tests
      run: |
        pytest tests
